<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Data Mahasiswa{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar"><a href="{{ url_for('mahasiswa_bp.index') }}">Data Mahasiswa</a></header>
  <main class="container">
    {% with pesan = get_flashed_messages(with_categories=true) %}
      {% for kategori, isi in pesan %}
        <div class="alert alert-{{ kategori }}">{{ isi }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
